{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold tracking-tight mb-8 text-zinc-900">Pensieri recenti</h1>

<div class="space-y-6">
    {% for post in posts %}
    <article class="group bg-white p-6 rounded-xl border border-zinc-200 shadow-xs hover:shadow-md transition-all duration-200 border-l-4 {{ post.season.border_accent }}">
    <div class="flex items-center space-x-3 mb-3">
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border {{ post.season.badge }}">
            {{ post.season.name }}
        </span>
        <small class="text-xs text-zinc-400">{{ post.date }}</small>
    </div>

    <h2 class="text-xl font-bold mb-2">
        <a href="/posts/{{ post.slug }}.html" class="text-zinc-900 transition {{ post.season.title_hover }}">
            {{ post.title }}
        </a>
    </h2>

    <p class="text-zinc-600 text-sm leading-relaxed">
        {{ post.summary }}
    </p>
</article>
    {% endfor %}
</div>
{% endblock %}
